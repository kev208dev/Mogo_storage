name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mogo
          POSTGRES_PASSWORD: mogo
          POSTGRES_DB: mogo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mogo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # integration tests (fake official source → DB → site). 외부 실제 사이트에는 요청하지 않는다.
      DATABASE_URL_TEST: postgres://mogo:mogo@localhost:5432/mogo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # 저장된 실제 source fixture 를 parser 에 통과 (네트워크 없음, fixture 가 없으면 통과)
      - run: npm run ingest:fixtures:validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
