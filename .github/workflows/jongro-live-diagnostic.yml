# temporary diagnostics only
name: Jongro live identity diagnostic

on:
  push:
    branches:
      - diag/jongro-live-identity-20260929

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect safe high3 page structure
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://www.jongro.co.kr/service/examResult/ex20260902/go3_resultCut.asp";
          const res = await fetch(url, {
            headers: {
              "User-Agent": "MogoStorageGradeCutWatch/1.0 (+https://mogo-storage.vercel.app)",
              Accept: "text/html",
            },
            redirect: "follow",
          });
          const bytes = new Uint8Array(await res.arrayBuffer());
          const contentType = res.headers.get("content-type") ?? "";
          const ascii = Buffer.from(bytes).subarray(0, 8192).toString("latin1");
          const metaCharset =
            ascii.match(/<meta[^>]+charset\s*=\s*["']?([^\s"'/>;]+)/i)?.[1] ??
            ascii.match(/<meta[^>]+content\s*=\s*["'][^"']*charset=([^\s"';>]+)/i)?.[1] ??
            null;
          const declaredEncoding = /charset=([\w-]+)/i.exec(contentType)?.[1] ?? null;
          const encoding = /^(?:euc-kr|cp949|ks_c_5601-1987)$/i.test(
            declaredEncoding ?? metaCharset ?? "",
          )
            ? "euc-kr"
            : "utf-8";
          const html = new TextDecoder(encoding, { fatal: false }).decode(bytes);
          const text = html
            .replace(/<script[\s\S]*?<\/script>/gi, " ")
            .replace(/<style[\s\S]*?<\/style>/gi, " ")
            .replace(/<[^>]+>/g, " ")
            .replace(/&nbsp;/gi, " ")
            .replace(/\s+/g, " ")
            .trim();
          const title = (html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] ?? "")
            .replace(/<[^>]+>/g, " ")
            .replace(/\s+/g, " ")
            .trim();
          const cutSnippets = [];
          for (const match of text.matchAll(/등급컷/g)) {
            const start = Math.max(0, match.index - 60);
            const end = Math.min(text.length, match.index + 90);
            cutSnippets.push(text.slice(start, end));
            if (cutSnippets.length >= 6) break;
          }
          const ids = [...new Set([...html.matchAll(/\bid=["']([^"']+)["']/gi)].map((m) => m[1]))]
            .filter((id) => /tab|cut|grade|subject/i.test(id))
            .slice(0, 80);
          const classes = [...new Set([...html.matchAll(/\bclass=["']([^"']+)["']/gi)].map((m) => m[1]))]
            .filter((name) => /tab|cut|grade|subject|view|list/i.test(name))
            .slice(0, 80);
          const altLabels = [...new Set([...html.matchAll(/\balt=["']([^"']*)["']/gi)].map((m) => m[1].trim()))]
            .filter(Boolean)
            .filter((label) => /국어|수학|영어|한국사|탐구|사회|과학|등급|점수|백분위|언어|화법|미적|기하|확률|생활|윤리|지리|역사|정치|경제|물리|화학|생명|지구/.test(label))
            .slice(0, 100);
          console.log(JSON.stringify({
            status: res.status,
            finalUrl: res.url,
            contentType,
            declaredEncoding,
            metaCharset,
            chosenEncoding: encoding,
            title,
            markers: {
              yearWithSuffix: text.includes("2026년"),
              yearBare: text.includes("2026"),
              grade: text.includes("고3"),
              dateDot: text.includes("9.2"),
              estimateCut: text.includes("추정 등급컷"),
              finalCut: text.includes("확정 등급컷"),
              expectedCut: text.includes("예상 등급컷"),
              rawCut: text.includes("등급컷"),
              tabController01: /id=["']tabController01["']/i.test(html),
              tabSubject02: /tab_subject02/i.test(html),
            },
            counts: {
              tables: (html.match(/<table\b/gi) ?? []).length,
              rows: (html.match(/<tr\b/gi) ?? []).length,
              cells: (html.match(/<(?:th|td)\b/gi) ?? []).length,
              tabConIds: (html.match(/id=["']tabCon\d+(?:_\d+)?["']/gi) ?? []).length,
            },
            cutSnippets,
            ids,
            classes,
            altLabels,
          }, null, 2));
          if (!res.ok) process.exitCode = 1;
          NODE
