name: English enrichment

# 이미 운영자가 브라우저로 확인·게시한 공식 영어 파일만 후처리한다.
# 자동 discovery 가 아니며, operator_import 는 verification_mode=operator_browser + ready 인 파일만 대상이다.
# SafeFetcher 는 정책상 허용된 파일 호스트만 요청한다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run | publish
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
      year:
        description: 시행 연도 (비우면 전체)
        required: false
        type: string
      grade:
        description: 학년 1~3 (비우면 전체)
        required: false
        type: string
      month:
        description: 월 1~12 (비우면 전체)
        required: false
        type: string
      exam:
        description: 특정 exam id (선택)
        required: false
        type: string
      limit:
        description: 한 번에 처리할 시험 수 (비우면 제한 없음)
        required: false
        type: string
      enqueue_materials:
        description: 단어/대본 변경 후 학습지 생성 job 예약
        required: true
        default: false
        type: boolean

concurrency:
  group: english-enrichment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: english:enrich
        env:
          DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.INGESTION_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          YEAR: ${{ inputs.year }}
          GRADE: ${{ inputs.grade }}
          MONTH: ${{ inputs.month }}
          EXAM: ${{ inputs.exam }}
          LIMIT: ${{ inputs.limit }}
          ENQUEUE_MATERIALS: ${{ inputs.enqueue_materials }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::repository secret INGESTION_DATABASE_URL 이 없습니다."
            exit 1
          fi
          args=()
          if [[ -n "$YEAR" ]]; then
            [[ "$YEAR" =~ ^20[0-9]{2}$ ]] || { echo "::error::year 는 4자리 연도"; exit 1; }
            args+=("--year=$YEAR")
          fi
          if [[ -n "$GRADE" ]]; then
            [[ "$GRADE" =~ ^[1-3]$ ]] || { echo "::error::grade 는 1~3"; exit 1; }
            args+=("--grade=$GRADE")
          fi
          if [[ -n "$MONTH" ]]; then
            [[ "$MONTH" =~ ^([1-9]|1[0-2])$ ]] || { echo "::error::month 는 1~12"; exit 1; }
            args+=("--month=$MONTH")
          fi
          if [[ -n "$EXAM" ]]; then
            [[ "$EXAM" =~ ^[A-Za-z0-9._:-]{1,120}$ ]] || { echo "::error::exam 형식 오류"; exit 1; }
            args+=("--exam=$EXAM")
          fi
          if [[ -n "$LIMIT" ]]; then
            [[ "$LIMIT" =~ ^[0-9]{1,4}$ ]] || { echo "::error::limit 는 숫자"; exit 1; }
            args+=("--limit=$LIMIT")
          fi
          if [[ "$MODE" != "publish" ]]; then args+=("--dry-run"); fi
          if [[ "$ENQUEUE_MATERIALS" == "true" ]]; then args+=("--enqueue-materials"); fi
          npm run -s english:enrich -- "${args[@]}"
