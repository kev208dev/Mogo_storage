name: Scheduled ingestion

# 기본 scheduler 는 GitHub Actions 이다.
# repository secrets: INGESTION_SITE_URL (예: https://mogo.example.com), CRON_SECRET
# INGESTION_SCHEDULER 를 명시하면 다른 scheduler 로 전환할 수 있다.
#   - 비어 있음 또는 github-actions: 실행
#   - 그 외 값: 이 workflow 는 skip
# secret 이 없으면 아무것도 하지 않고 성공으로 끝난다.
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scheduled-ingestion.yml"
      - "src/app/api/cron/[task]/route.ts"
  workflow_dispatch:
    inputs:
      task:
        description: "scheduled | release-watch | jobs"
        default: scheduled

concurrency:
  group: scheduled-ingestion
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call ingestion endpoint
        env:
          SCHEDULER: ${{ vars.INGESTION_SCHEDULER }}
          SITE_URL: ${{ secrets.INGESTION_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TASK: ${{ github.event.inputs.task || 'scheduled' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            # 성공으로 끝나지만 annotation 으로 드러낸다 (job worker 가 호출되지 않음 → watchdog 의 jobs never_run/stale)
            echo "::warning::Ingestion endpoint credentials (INGESTION_SITE_URL / CRON_SECRET) are not configured — skipping."
            exit 0
          fi
          if [ -n "$SCHEDULER" ] && [ "$SCHEDULER" != "github-actions" ]; then
            echo "::notice::Scheduled ingestion is configured for another scheduler ($SCHEDULER) — skipping."
            exit 0
          fi

          # 응답 요약을 annotation 으로 남긴다 (skip 사유 · job 처리 수). 본문에는 비밀값·URL 이 없다
          call_task() {
            local task="$1"
            local body code=0
            body=$(curl --fail-with-body -sS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" -H "X-Scheduler: github-actions" "$SITE_URL/api/cron/$task") || code=$?
            echo "$body"
            local summary
            summary=$(printf '%s' "$body" | jq -c '{skipped, ok, error} + (if (.result.processed? // null) != null then {processed: .result.processed, completed: .result.completed, failed: .result.failed} elif (.result.discovery? // null) != null then {discovery: (.result.discovery | length), rechecks: .result.rechecksQueued, jobs_failed: (.result.jobs.failed // 0)} else {} end) | with_entries(select(.value != null))' 2>/dev/null || echo '"unparsed"')
            echo "::notice title=cron/$task::$summary"
            return $code
          }

          # 주기/배포 트리거에서는 검증·승인된 PROCESS queue 를 먼저 비운다.
          # 새 외부 discovery 는 /scheduled 의 INGESTION_ENABLED gate 가 계속 제어한다.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ]; then
            call_task jobs
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$TASK" != "jobs" ]; then
            call_task "$TASK"
          fi
