name: Diagnostic EBSi live structure

on:
  push:
    branches:
      - fix/ebsi-live-ingestion-and-english-backfill

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect EBSi public previous-paper HTML
        env:
          URL: https://www.ebsi.co.kr/ebs/xip/xipc/previousPaperList.ebs?targetCd=D300&year=2026
        run: |
          node <<'NODE'
          const url = process.env.URL;
          const res = await fetch(url, {
            headers: {
              "user-agent": "MogoStorageBot/1.0 (+https://github.com/kev208dev/Mogo_storage)",
              accept: "text/html,application/xhtml+xml"
            },
            redirect: "follow"
          });
          const html = await res.text();
          console.log(JSON.stringify({
            status: res.status,
            finalUrl: res.url,
            contentType: res.headers.get("content-type"),
            length: html.length,
            ulBoardList: (html.match(/<ul[^>]+class=["'][^"']*board_list/gi) || []).length,
            tableCount: (html.match(/<table\b/gi) || []).length,
            tbodyCount: (html.match(/<tbody\b/gi) || []).length,
            trCount: (html.match(/<tr\b/gi) || []).length,
            dataExamId: (html.match(/data-exam-id/gi) || []).length,
            hrefCount: (html.match(/href=/gi) || []).length,
            onclickCount: (html.match(/onclick=/gi) || []).length,
            pdfCount: (html.match(/\.pdf/gi) || []).length,
            xlsCount: (html.match(/\.xls/gi) || []).length,
            downloadWord: (html.match(/다운로드/g) || []).length,
            questionWord: (html.match(/문제/g) || []).length,
            answerWord: (html.match(/정답/g) || []).length,
            englishWord: (html.match(/영어/g) || []).length
          }, null, 2));

          const classNames = new Map();
          for (const m of html.matchAll(/class=["']([^"']+)["']/gi)) {
            for (const c of m[1].trim().split(/\s+/)) classNames.set(c, (classNames.get(c)||0)+1);
          }
          console.log("TOP_CLASSES");
          console.log([...classNames.entries()].sort((a,b)=>b[1]-a[1]).slice(0,80).map(([k,v])=>k+":"+v).join("\n"));

          const text = html
            .replace(/<script[\s\S]*?<\/script>/gi, " ")
            .replace(/<style[\s\S]*?<\/style>/gi, " ")
            .replace(/<[^>]+>/g, "\n")
            .replace(/&nbsp;/g, " ")
            .replace(/&amp;/g, "&")
            .replace(/&#39;/g, "'")
            .replace(/&quot;/g, '"');
          const lines = text.split(/\n+/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
          console.log("MATCHED_TEXT");
          console.log(lines.filter(s=>/(2026|9월|모의|학력|국어|수학|영어|한국사|사회|과학|문제|정답|해설)/.test(s)).slice(0,250).join("\n"));

          console.log("LINKISH");
          const linkish = [];
          for (const m of html.matchAll(/<(?:a|button)\b([^>]*)>([\s\S]*?)<\/(?:a|button)>/gi)) {
            const attrs=m[1];
            const label=m[2].replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
            if (!/(문제|정답|해설|국어|수학|영어|한국사|사회|과학|PDF|다운)/i.test(label+attrs)) continue;
            const href=(/href=["']([^"']+)["']/i.exec(attrs)||[])[1]||"";
            const onclick=(/onclick=["']([^"']+)["']/i.exec(attrs)||[])[1]||"";
            linkish.push(JSON.stringify({label,href,onclick}));
          }
          console.log(linkish.slice(0,250).join("\n"));

          console.log("SCRIPT_NETWORK_HINTS");
          const hints = [];
          for (const line of html.split(/\n/)) {
            const s = line.trim();
            if (/(previousPaper|xipc|ajax|fetch\(|\.ebs|paper|search|retrieve|down|download|xhr|XMLHttpRequest|url\s*:)/i.test(s)) {
              hints.push(s.replace(/\s+/g, " ").slice(0, 600));
            }
          }
          console.log([...new Set(hints)].slice(0,500).join("\n"));

          console.log("TARGETED_SNIPPETS");
          const needles = ["irecord", "previousPaper", "targetCd", "main_board_item", "main_board_subject", ".pdf", "wdown.ebsi.co.kr", "xipc", "searchForm", "goSearch", "searchList", "retrieve"];
          for (const needle of needles) {
            console.log("== "+needle+" ==");
            let from = 0;
            let count = 0;
            const lower = html.toLowerCase();
            const n = needle.toLowerCase();
            while (count < 25) {
              const at = lower.indexOf(n, from);
              if (at < 0) break;
              console.log(html.slice(Math.max(0, at-700), Math.min(html.length, at+1400)).replace(/\s+/g, " ").slice(0,2100));
              from = at + n.length;
              count++;
            }
          }

          console.log("PAPER_FORM_CONTEXT");
          for (const needle of ["paperListFrm", "previousPaperUserLevelCho.ajax", "goDownLoad(", "goDownLoadA(", "goDownLoadD(", "irecord="]) {
            const at = html.indexOf(needle);
            console.log("## "+needle+" @ "+at);
            if (at >= 0) console.log(html.slice(Math.max(0,at-6000), Math.min(html.length,at+18000)).replace(/\s+/g," ").slice(0,24000));
          }
          console.log("DOWNLOAD_CALLS");
          const calls = [];
          for (const m of html.matchAll(/goDownLoad[A-Z]?\s*\(([^)]{1,1200})\)/g)) calls.push(m[0].replace(/\s+/g," "));
          console.log([...new Set(calls)].slice(0,300).join("\n"));

          console.log("AJAX_FRAGMENT");
          const monthValues = [...html.matchAll(/name=["\']month["\'][^>]*value=["\']([^"\']+)["\']/gi)].map(m=>m[1]);
          const ordNames = ["korArOrd","mathArOrd","engArOrd","hisArOrd","srch1ArOrd","srch2ArOrd","jobArOrd","scndForgnlngArOrd"];
          const ordValues = ordNames.map(name => {
            const re = new RegExp(`name=["\']${name}["\'][^>]*value=["\']([^"\']+)["\']`, "i");
            return (re.exec(html)||[])[1] || "";
          }).filter(Boolean);
          const body = new URLSearchParams({
            targetCd: "D300",
            yearList: "2026",
            monthList: monthValues.join(","),
            arOrd: ordValues.join(","),
            subjIdList: "firstEnter",
            sort: "recent",
            paperId: "", paperNo: "", lvl: ""
          });
          console.log(JSON.stringify({monthValues, ordValues, postBody: body.toString()}, null, 2));
          const ajaxUrl = "https://www.ebsi.co.kr/ebs/xip/xipc/previousPaperListAjax.ajax";
          const ajaxRes = await fetch(ajaxUrl, {
            method: "POST",
            headers: {
              "user-agent": "MogoStorageBot/1.0 (+https://github.com/kev208dev/Mogo_storage)",
              accept: "text/html,*/*",
              "content-type": "application/x-www-form-urlencoded; charset=UTF-8",
              referer: url
            },
            body
          });
          const frag = await ajaxRes.text();
          console.log(JSON.stringify({status:ajaxRes.status, contentType:ajaxRes.headers.get("content-type"), length:frag.length}, null, 2));
          const fragClasses = new Map();
          for (const m of frag.matchAll(/class=["\']([^"\']+)["\']/gi)) for (const cl of m[1].trim().split(/\s+/)) fragClasses.set(cl,(fragClasses.get(cl)||0)+1);
          console.log("FRAG_TOP_CLASSES");
          console.log([...fragClasses.entries()].sort((a,b)=>b[1]-a[1]).slice(0,100).map(([k,v])=>`${k}:${v}`).join("\n"));
          console.log("FRAG_TEXT");
          const fragText = frag.replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<[^>]+>/g,"\n").replace(/&nbsp;/g," ").replace(/&amp;/g,"&");
          console.log(fragText.split(/\n+/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean).slice(0,600).join("\n"));
          console.log("FRAG_DOWNLOAD_CALLS");
          const fragCalls=[];
          for (const m of frag.matchAll(/goDownLoad[A-Z0-9]*\s*\(([^)]{1,1500})\)/g)) fragCalls.push(m[0].replace(/\s+/g," "));
          console.log([...new Set(fragCalls)].slice(0,600).join("\n"));

          console.log("FRAG_PAGING");
          const pAt = frag.indexOf('name="pagingForm"');
          console.log("pagingForm@",pAt);
          if (pAt>=0) console.log(frag.slice(Math.max(0,pAt-1200),Math.min(frag.length,pAt+6000)).replace(/\s+/g," ").slice(0,7200));
          const pInputs=[];
          for(const m of frag.matchAll(/<input\b([^>]*)>/gi)){ const attrs=m[1]; const name=(/name=["\']([^"\']+)["\']/i.exec(attrs)||[])[1]; const value=(/value=["\']([^"\']*)["\']/i.exec(attrs)||[])[1]??""; if(name) pInputs.push({name,value}); }
          console.log(JSON.stringify(pInputs,null,2));
          const page2 = new URLSearchParams(body); page2.set("currentPage","2");
          const p2res=await fetch(ajaxUrl,{method:"POST",headers:{"user-agent":"MogoStorageBot/1.0 (+https://github.com/kev208dev/Mogo_storage)",accept:"text/html,*/*","content-type":"application/x-www-form-urlencoded; charset=UTF-8",referer:url},body:page2});
          const p2=await p2res.text();
          const p2text=p2.replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<[^>]+>/g,"\n").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").split(/\n+/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean).slice(0,160);
          console.log("PAGE2_TEXT"); console.log(p2text.join("\n"));
          NODE
