name: EBSi live probe

on:
  push:
    branches:
      - feat/finish-remaining-development
    paths:
      - "src/ingestion/sources/ebsi/**"
      - "src/ingestion/sources/parser-versions.json"
      - "tests/fixtures/ebsi/**"
      - ".github/workflows/ebsi-live-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit parser tests
        run: npm test -- --run tests/unit/ingestion-parsers.test.ts
      - name: Capture current EBSi high3 archive shell
        continue-on-error: true
        run: npm run -s ingest:capture -- --source=ebsi --page-type=exam_list --grade=3 --year=2026 --name=ebsi-g3-2026-shell
      - name: Capture EBSi AJAX result
        run: |
          node --import tsx - <<'NODE'
          const { writeFile, mkdir } = await import("node:fs/promises");
          const { decodeHtml } = await import("./src/ingestion/net/fetcher.ts");
          const { sanitizeFixtureHtml } = await import("./src/ingestion/fixtures/sanitize.ts");
          const { builtinSource, createFetcherFor } = await import("./src/ingestion/sources/registry.ts");
          const source = builtinSource("ebsi");
          if (!source) throw new Error("EBSi source missing");
          const fetcher = createFetcherFor({ ...source, enabled: true });
          const body = new URLSearchParams({
            targetCd: "D300",
            yearList: "2026",
            monthList: "03,04,05,06,07,08,09,10,11,12",
            arOrd: "1,2,3,4,5,,6,7,8",
            subjIdList: "firstEnter",
            sort: "recent",
          });
          const res = await fetcher.fetch(
            "https://www.ebsi.co.kr/ebs/xip/xipc/previousPaperListAjax.ajax",
            {
              method: "POST",
              accept: "text/html",
              headers: {
                "content-type": "application/x-www-form-urlencoded; charset=UTF-8",
                "x-requested-with": "XMLHttpRequest",
                referer: "https://www.ebsi.co.kr/ebs/xip/xipc/previousPaperList.ebs?targetCd=D300",
              },
              body,
              maxBytes: 5 * 1024 * 1024,
            },
          );
          const raw = decodeHtml(res);
          const { html } = sanitizeFixtureHtml(raw);
          await mkdir("tests/fixtures/live/ebsi", { recursive: true });
          await writeFile("tests/fixtures/live/ebsi/ebsi-g3-2026-ajax.html", html);
          console.log("AJAX", res.status, res.contentType, html.length);
          NODE
      - name: Strict EBSi health
        continue-on-error: true
        run: npm run -s ingest:health -- --source=ebsi --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebsi-live-probe
          path: tests/fixtures/live/ebsi
          if-no-files-found: ignore
