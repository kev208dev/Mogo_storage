name: Format feature branch

on:
  push:
    branches:
      - feat/finish-remaining-development
    paths:
      - ".github/workflows/format-feature-branch.yml"
      - "docs/ENGLISH_STUDY.md"
      - "docs/SOURCE_SURVEY.md"
      - "src/ingestion/cli/study-backfill.ts"
      - "src/ingestion/jobs/study-handlers.ts"
      - "src/ingestion/sources/ebsi/parser.ts"
      - "src/ingestion/study/artifact-fetch.ts"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/ENGLISH_STUDY.md docs/SOURCE_SURVEY.md src/ingestion/cli/study-backfill.ts src/ingestion/jobs/study-handlers.ts src/ingestion/sources/ebsi/parser.ts src/ingestion/study/artifact-fetch.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-feature-files
          path: |
            docs/ENGLISH_STUDY.md
            docs/SOURCE_SURVEY.md
            src/ingestion/cli/study-backfill.ts
            src/ingestion/jobs/study-handlers.ts
            src/ingestion/sources/ebsi/parser.ts
            src/ingestion/study/artifact-fetch.ts
