name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mogo
          POSTGRES_PASSWORD: mogo
          POSTGRES_DB: mogo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mogo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://mogo:mogo@localhost:5432/mogo_test
      E2E_DATABASE_URL: postgres://mogo:mogo@localhost:5432/mogo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --write src/components/exam/GradeCutTable.tsx tests/unit/grade-cut-table.test.ts
      - run: git diff -- src/components/exam/GradeCutTable.tsx tests/unit/grade-cut-table.test.ts
      - run: npm run format:check
      - run: npx drizzle-kit generate --name=ci_drift_check && git diff --exit-code -- drizzle && test -z "$(git status --porcelain drizzle)"
      - run: DATABASE_URL=$DATABASE_URL_TEST npm run db:migrate:prod
      - run: npm test
      - run: npm run ingest:fixtures:validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
