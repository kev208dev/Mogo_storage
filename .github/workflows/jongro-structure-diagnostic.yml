name: Jongro live structure diagnostic

on:
  push:
    branches:
      - diag/jongro-live-dry-run-20260929

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect live Jongro DOM structure
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { parse } from "node-html-parser";
          import { SafeFetcher, decodeHtml } from "./src/ingestion/net/fetcher.ts";

          const url = "https://www.jongro.co.kr/service/examResult/ex20260902/go1_resultCut.asp";
          const fetcher = new SafeFetcher({
            policy: { allowedHosts: ["www.jongro.co.kr"], allowHttp: false },
            timeoutMs: 15000,
            maxConcurrent: 1,
            minGapMs: 2000,
            maxRetries: 2,
            userAgent: "MogoStorageGradeCutWatch/1.0 (+https://mogo-storage.vercel.app)",
            respectRobots: true,
          });
          const response = await fetcher.fetch(url, { accept: "text/html", maxBytes: 1_000_000 });
          const html = decodeHtml(response);
          const root = parse(html);
          const clean = (s, n = 220) => String(s ?? "").replace(/\s+/g, " ").trim().slice(0, n);
          const visible = (node) => clean(node.textContent + " " + node.querySelectorAll("img").map((img) => img.getAttribute("alt") ?? "").join(" "));
          const elementInfo = (node) => ({
            tag: node?.rawTagName ?? null,
            id: node?.getAttribute?.("id") ?? "",
            className: node?.getAttribute?.("class") ?? "",
            text: node?.textContent ? clean(node.textContent) : "",
            alts: node?.querySelectorAll ? node.querySelectorAll("img").map((img) => clean(img.getAttribute("alt") ?? "")).filter(Boolean).slice(0, 20) : [],
          });
          const tables = root.querySelectorAll("table.view_data01");
          const summary = {
            subjectMenus: root.querySelectorAll(".tab_subject01, .tab_subject02").map((n) => elementInfo(n)),
            tables: tables.map((table, index) => {
              const parent = table.parentNode;
              const grand = parent?.parentNode;
              const siblings = parent?.childNodes?.filter((n) => n.rawTagName).map((n) => elementInfo(n)).slice(0, 20) ?? [];
              return {
                index,
                table: elementInfo(table),
                parent: elementInfo(parent),
                grandparent: elementInfo(grand),
                siblings,
                firstRows: table.querySelectorAll("tr").slice(0, 5).map((row) => row.querySelectorAll("th,td").map((cell) => ({
                  text: clean(cell.textContent),
                  visible: visible(cell),
                  alts: cell.querySelectorAll("img").map((img) => clean(img.getAttribute("alt") ?? "")).filter(Boolean),
                }))),
              };
            }),
          };
          console.log(JSON.stringify(summary, null, 2));
          NODE
