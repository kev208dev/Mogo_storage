name: Scheduled ingestion

# 기본 scheduler 는 GitHub Actions 이다.
#   repository secrets   INGESTION_SITE_URL (예: https://mogo.example.com), CRON_SECRET
# INGESTION_SCHEDULER 를 명시하면 다른 scheduler 로 전환할 수 있다.
#   - 비어 있음 또는 github-actions: 실행
#   - 그 외 값: 이 workflow 는 skip
# secret 이 없으면 아무것도 하지 않고 성공으로 끝난다.
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scheduled-ingestion.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "scheduled | release-watch | jobs"
        default: scheduled

concurrency:
  group: scheduled-ingestion
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call ingestion endpoint
        env:
          SCHEDULER: ${{ vars.INGESTION_SCHEDULER }}
          SITE_URL: ${{ secrets.INGESTION_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TASK: ${{ github.event.inputs.task || 'scheduled' }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Ingestion endpoint credentials are not configured — skipping."
            exit 0
          fi
          if [ -n "$SCHEDULER" ] && [ "$SCHEDULER" != "github-actions" ]; then
            echo "Scheduled ingestion is configured for another scheduler ($SCHEDULER) — skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 320             -H "Authorization: Bearer $CRON_SECRET"             "$SITE_URL/api/cron/$TASK"
