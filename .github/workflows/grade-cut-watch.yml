name: Grade cut watch

# 5분 등급컷 polling 의 주 scheduler 는 Supabase pg_cron + pg_net 이다 (docs/OPERATIONS.md, db-scheduler.yml).
# GitHub Actions `schedule` 은 best-effort 라 이 저장소에서 5분 cron 이 2~4시간 간격으로만 실행됐고,
# Vercel Hobby 는 5분 Cron 배포를 거절한다. 이 workflow 는 수동 실행(보조)용으로만 남긴다.
# endpoint 는 PostgreSQL advisory lock 을 쓰므로 pg_cron 과 겹쳐 실행돼도 안전하다.
on:
  workflow_dispatch:

concurrency:
  group: grade-cut-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call grade cut endpoint
        env:
          SCHEDULER: ${{ vars.GRADE_CUT_SCHEDULER }}
          SITE_URL: ${{ secrets.INGESTION_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ "$SCHEDULER" != "github-actions" ] || [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Grade cut scheduler not configured — skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "X-Scheduler: github-manual" \
            "$SITE_URL/api/cron/grade-cuts"
