name: Grade cut watch

# Vercel Hobby does not accept a five-minute Cron expression. The endpoint
# remains deployment-independent and PostgreSQL advisory locked.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: grade-cut-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call grade cut endpoint
        env:
          SCHEDULER: ${{ vars.GRADE_CUT_SCHEDULER }}
          SITE_URL: ${{ secrets.INGESTION_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ "$SCHEDULER" != "github-actions" ] || [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Grade cut scheduler not configured — skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/grade-cuts"
