name: Answer keys (extract)

# 게시된 공식 정답·해설 PDF + 문제지 → 정답·배점·해설 쪽 · 개념 태그 (npm run answers:extract, 수동 실행).
#   dry-run  결과만 출력 (DB 쓰기 없음)
#   record   answer_key_extractions 에 기록 (게시 안 함)
#   publish  검증된 슬롯만 questions 에 게시 + 개념 태그 연결 (기존 문항 정답이 다르면 덮어쓰지 않음)
# 정책상 허용된 호스트(EBSi 파일 서버)만 SafeFetcher 로 요청한다 (요청 간격 · redirect 재검증).
# 같은 파서 버전으로 처리한 시험·영역은 건너뛴다 — 여러 번 실행해도 안전하다.
# repository secrets: INGESTION_DATABASE_URL(운영 DB), INGESTION_SITE_URL, CRON_SECRET(게시 후 페이지 재검증)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run | record | publish
        required: true
        default: dry-run
        type: choice
        options: [dry-run, record, publish]
      year:
        description: 연도만 (비우면 전체)
        required: false
        type: string
      limit:
        description: 한 번에 처리할 시험·영역 수 (비우면 제한 없음)
        required: false
        type: string

concurrency:
  group: answer-keys
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: answers:extract
        env:
          DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.INGESTION_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          YEAR: ${{ inputs.year }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::repository secret INGESTION_DATABASE_URL (운영 DB 연결 문자열) 이 없습니다."
            exit 1
          fi
          args=()
          if [[ -n "$YEAR" ]]; then
            [[ "$YEAR" =~ ^20[0-9]{2}$ ]] || { echo "::error::year 는 4자리 연도"; exit 1; }
            args+=("--year=$YEAR")
          fi
          if [[ -n "$LIMIT" ]]; then
            [[ "$LIMIT" =~ ^[0-9]{1,4}$ ]] || { echo "::error::limit 는 숫자"; exit 1; }
            args+=("--limit=$LIMIT")
          fi
          case "$MODE" in
            publish) args+=("--publish") ;;
            record) ;;
            *) args+=("--dry-run") ;;
          esac
          npm run -s answers:extract -- "${args[@]}"
