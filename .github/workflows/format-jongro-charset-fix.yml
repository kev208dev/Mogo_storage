name: Format Jongro charset fix

on:
  push:
    branches:
      - fix/jongro-euc-kr-meta-charset

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jongro-euc-kr-meta-charset
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and commit
        shell: bash
        run: |
          npx prettier --write tests/unit/html-decode.test.ts src/ingestion/net/fetcher.ts
          rm .github/workflows/format-jongro-charset-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/html-decode.test.ts src/ingestion/net/fetcher.ts .github/workflows/format-jongro-charset-fix.yml
          git commit -m "style: format Jongro charset fix"
          git push origin HEAD:fix/jongro-euc-kr-meta-charset
