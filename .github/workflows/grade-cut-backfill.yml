name: Grade cuts (backfill)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, publish]
        default: dry-run
        required: true
      live:
        type: boolean
        default: true
        description: Fetch the live provider source instead of offline fixtures
        required: true
      year:
        type: string
        default: "2026"
        required: true
      grade:
        type: choice
        options: ["", "1", "2", "3"]
        default: ""
        required: false
      month:
        type: string
        default: ""
        required: false
      exam_date:
        type: string
        default: ""
        description: "DB 없이 live dry-run 할 시험일 (YYYY-MM-DD, 예: 2026-10-20). 비우면 DB 의 시험 목록"
        required: false
      source:
        type: choice
        options: [jongro, megastudy]
        default: jongro
        required: true
      limit:
        type: string
        default: "10"
        required: true

concurrency:
  group: grade-cuts-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INGESTION_DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check publish database
        if: inputs.mode == 'publish'
        run: |
          if [ -z "$INGESTION_DATABASE_URL" ]; then
            echo "::error::INGESTION_DATABASE_URL is required for publish."
            exit 1
          fi
      - name: Backfill
        shell: bash
        run: |
          args=(--year="${{ inputs.year }}" --limit="${{ inputs.limit }}" --"${{ inputs.mode }}")
          [ -z "${{ inputs.grade }}" ] || args+=(--grade="${{ inputs.grade }}")
          [ -z "${{ inputs.month }}" ] || args+=(--month="${{ inputs.month }}")
          if [ -n "${{ inputs.exam_date }}" ]; then
            if [ "${{ inputs.mode }}" = "publish" ]; then
              echo "::error::exam_date is only for live dry-run (publish uses the database exams)."
              exit 1
            fi
            args+=(--exam-date="${{ inputs.exam_date }}")
          fi
          args+=(--source="${{ inputs.source }}")
          if [[ "${{ inputs.live }}" == "true" || "${{ inputs.mode }}" == "publish" ]]; then
            args+=(--live)
          else
            args+=(--fixture)
          fi
          npm run grade-cuts:backfill -- "${args[@]}"
