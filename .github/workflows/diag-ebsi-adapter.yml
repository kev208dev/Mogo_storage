name: Diagnostic English direct files

on:
  push:
    branches:
      - fix/ebsi-live-ingestion-and-english-backfill

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npx vitest run tests/unit/ingestion-security.test.ts tests/integration/english-study.test.ts
      - name: Safe direct-file probe
        run: |
          node --import tsx <<'NODE'
          const { createUrlCheckFetcher, checkCandidateUrl } =
            await import("./src/ingestion/manual-import/url-check.ts");
          const fetcher = createUrlCheckFetcher();
          const urls = [
            "https://wdown.ebsi.co.kr/W61001/01exam/20260902/go3/eng_1_mp3_4Q555FY3.mp3",
            "https://wdown.ebsi.co.kr/W61001/01exam/20260902/go3/eng_1_scr_G2YZUO58.pdf"
          ];
          for (const url of urls) {
            const result = await checkCandidateUrl(fetcher, url);
            console.log(JSON.stringify({
              file: new URL(url).pathname.split("/").pop(),
              ok: result.ok,
              reason: result.ok ? null : result.reason,
              evidence: result.evidence ?? null
            }));
            if (!result.ok) process.exitCode = 1;
          }
          NODE
