name: Retry Jongro live DOM parser fix

on:
  push:
    branches:
      - fix/jongro-live-dom-parser

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jongro-live-dom-parser
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse patch script, validate, and commit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap
          raw = Path('.github/workflows/apply-jongro-live-dom-fix.yml').read_text()
          body = raw.split("python <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          Path('/tmp/jongro_patch.py').write_text(textwrap.dedent(body))
          PY
          python /tmp/jongro_patch.py
          npx prettier --write src/ingestion/grade-cuts/adapters/jongro.ts tests/unit/grade-cut-jongro.test.ts
          npx next typegen
          npm run typecheck
          npm test -- --run tests/unit/grade-cut-jongro.test.ts
          rm .github/workflows/apply-jongro-live-dom-fix.yml .github/workflows/retry-jongro-live-dom-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ingestion/grade-cuts/adapters/jongro.ts tests/unit/grade-cut-jongro.test.ts .github/workflows/apply-jongro-live-dom-fix.yml .github/workflows/retry-jongro-live-dom-fix.yml
          git commit -m "fix: parse Jongro live tab DOM"
          git push origin HEAD:fix/jongro-live-dom-parser
