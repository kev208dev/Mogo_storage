# temporary diagnostics only
name: Jongro live identity diagnostic

on:
  push:
    branches:
      - diag/jongro-live-identity-20260929

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Show Prettier diff for PR branch
        shell: bash
        run: |
          git fetch origin fix/jongro-high3-live-course-labels
          git switch --detach FETCH_HEAD
          npm ci
          npx prettier --write src/ingestion/grade-cuts/adapters/jongro.ts tests/unit/grade-cut-jongro-live-high3.test.ts
          git diff -- src/ingestion/grade-cuts/adapters/jongro.ts tests/unit/grade-cut-jongro-live-high3.test.ts
