name: English study backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run | enqueue | status (읽기 전용 상태 보고)
        required: true
        default: dry-run
        type: choice
        options: [dry-run, enqueue, status]
      year:
        description: 시행 연도 (비우면 전체)
        required: false
        type: string
      grade:
        description: 학년 1|2|3 (비우면 전체)
        required: false
        type: string
      month:
        description: 시행 월 1..12 (비우면 전체)
        required: false
        type: string
      process:
        description: enqueue 후 운영 앱의 /api/cron/jobs 로 queue 처리 (운영 스토리지 사용)
        required: true
        default: true
        type: boolean

concurrency:
  group: english-study-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: English study backfill
        env:
          DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.INGESTION_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          YEAR: ${{ inputs.year }}
          GRADE: ${{ inputs.grade }}
          MONTH: ${{ inputs.month }}
          PROCESS: ${{ inputs.process }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::repository secret INGESTION_DATABASE_URL 이 없습니다."
            exit 1
          fi
          args=()
          if [[ -n "$YEAR" ]]; then
            [[ "$YEAR" =~ ^20[0-9]{2}$ ]] || { echo "::error::year 는 4자리 연도"; exit 1; }
            args+=("--year=$YEAR")
          fi
          if [[ -n "$GRADE" ]]; then
            [[ "$GRADE" =~ ^[123]$ ]] || { echo "::error::grade 는 1|2|3"; exit 1; }
            args+=("--grade=$GRADE")
          fi
          if [[ -n "$MONTH" ]]; then
            [[ "$MONTH" =~ ^([1-9]|1[0-2])$ ]] || { echo "::error::month 는 1..12"; exit 1; }
            args+=("--month=$MONTH")
          fi
          if [[ "$MODE" == "dry-run" ]]; then
            args+=("--dry-run")
          elif [[ "$MODE" == "status" ]]; then
            args+=("--status")
          fi
          # runner 에서는 enqueue 만 한다. 학습지 PDF 는 스토리지에 써야 하므로 PROCESS job 은
          # 운영 앱(실제 스토리지 설정)의 /api/cron/jobs 가 처리한다.
          npm run -s study:backfill -- "${args[@]}"
      - name: Drain PROCESS queue via production app
        if: inputs.mode == 'enqueue' && inputs.process
        env:
          SITE_URL: ${{ secrets.INGESTION_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::INGESTION_SITE_URL / CRON_SECRET secret 이 없습니다."
            exit 1
          fi
          for i in 1 2 3 4; do
            body=$(curl --fail-with-body -sS --max-time 320 \
              -H "Authorization: Bearer $CRON_SECRET" -H "X-Scheduler: github-actions" \
              "$SITE_URL/api/cron/jobs")
            echo "$body"
            processed=$(echo "$body" | jq -r '.result.processed // 0')
            released=$(echo "$body" | jq -r '.result.released // 0')
            if [ "$processed" = "0" ] && [ "$released" = "0" ]; then break; fi
          done
      - name: Status after processing (read-only)
        if: always() && inputs.mode == 'enqueue'
        env:
          DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL }}
          YEAR: ${{ inputs.year }}
          GRADE: ${{ inputs.grade }}
          MONTH: ${{ inputs.month }}
        run: |
          args=("--status")
          [[ -n "$YEAR" ]] && args+=("--year=$YEAR")
          [[ -n "$GRADE" ]] && args+=("--grade=$GRADE")
          [[ -n "$MONTH" ]] && args+=("--month=$MONTH")
          npm run -s study:backfill -- "${args[@]}"
