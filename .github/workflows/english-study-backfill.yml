name: English study backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run | enqueue
        required: true
        default: dry-run
        type: choice
        options: [dry-run, enqueue]
      year:
        description: 시행 연도 (비우면 전체)
        required: false
        type: string
      grade:
        description: 학년 1|2|3 (비우면 전체)
        required: false
        type: string
      month:
        description: 시행 월 1..12 (비우면 전체)
        required: false
        type: string
      process:
        description: enqueue 후 jobs worker까지 실행
        required: true
        default: true
        type: boolean

concurrency:
  group: english-study-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: English study backfill
        env:
          DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.INGESTION_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          YEAR: ${{ inputs.year }}
          GRADE: ${{ inputs.grade }}
          MONTH: ${{ inputs.month }}
          PROCESS: ${{ inputs.process }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::repository secret INGESTION_DATABASE_URL 이 없습니다."
            exit 1
          fi
          args=()
          if [[ -n "$YEAR" ]]; then
            [[ "$YEAR" =~ ^20[0-9]{2}$ ]] || { echo "::error::year 는 4자리 연도"; exit 1; }
            args+=("--year=$YEAR")
          fi
          if [[ -n "$GRADE" ]]; then
            [[ "$GRADE" =~ ^[123]$ ]] || { echo "::error::grade 는 1|2|3"; exit 1; }
            args+=("--grade=$GRADE")
          fi
          if [[ -n "$MONTH" ]]; then
            [[ "$MONTH" =~ ^([1-9]|1[0-2])$ ]] || { echo "::error::month 는 1..12"; exit 1; }
            args+=("--month=$MONTH")
          fi
          if [[ "$MODE" == "dry-run" ]]; then
            args+=("--dry-run")
          elif [[ "$PROCESS" == "true" ]]; then
            args+=("--process" "--limit=500" "--budget=1200")
          fi
          npm run -s study:backfill -- "${args[@]}"
